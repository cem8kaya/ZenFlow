; ============================================================================
;  ZenFlow Core2 (Edge Edition) — PlatformIO project configuration
;  Target: M5Stack Core2 for AWS (ESP32-D0WDQ6-V3, 16MB flash, 8MB PSRAM)
;
;  Fully OFFLINE build: no cloud / AWS backend. Everything (breathing engine,
;  focus timer, Zen garden, gamification, offline Zen Coach) runs on-device.
; ============================================================================

[platformio]
default_envs = m5stack-core2
src_dir = src
include_dir = include

[env:m5stack-core2]
platform = espressif32@^6.9.0
board = m5stack-core2
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000

; 16MB flash partition scheme (see partitions_16MB.csv)
board_build.partitions = partitions_16MB.csv
board_upload.flash_size = 16MB
; PSRAM is enabled via -D BOARD_HAS_PSRAM below; the m5stack-core2 board
; definition already selects the correct QIO flash/PSRAM mode.

lib_deps =
    m5stack/M5Unified@^0.2.5
    lvgl/lvgl@^8.4.0
    adafruit/Adafruit NeoPixel@^1.12.3   ; 10x SK6812 side LEDs

build_flags =
    ; --- LVGL: use our include/lv_conf.h ---
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    ; --- ESP32 / PSRAM ---
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=2
    ; --- App feature flags (offline build) ---
    -D ZF_OFFLINE_ONLY=1
